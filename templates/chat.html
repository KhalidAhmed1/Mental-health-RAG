<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mental Health Support Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #f5f5f5; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .chat-container { width: 480px; height: 680px; background: white; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.1); display: flex; flex-direction: column; overflow: hidden; }
    .chat-header { background: #4f46e5; color: white; padding: 20px; font-size: 18px; font-weight: 600; }
    .chat-header span { font-size: 13px; font-weight: 400; opacity: 0.8; display: block; margin-top: 4px; }
    .chat-messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
    .message { max-width: 80%; padding: 12px 16px; border-radius: 12px; font-size: 14px; line-height: 1.6; }
    .message.user { align-self: flex-end; background: #4f46e5; color: white; border-bottom-right-radius: 4px; }
    .message.bot { align-self: flex-start; background: #f0f0f0; color: #333; border-bottom-left-radius: 4px; }
    .message.bot .meta { font-size: 11px; color: #888; margin-top: 6px; }
    .typing { align-self: flex-start; background: #f0f0f0; padding: 12px 16px; border-radius: 12px; border-bottom-left-radius: 4px; font-size: 14px; color: #888; }
    .chat-input { display: flex; padding: 16px; gap: 10px; border-top: 1px solid #eee; }
    .chat-input input { flex: 1; padding: 12px 16px; border: 1px solid #ddd; border-radius: 24px; font-size: 14px; outline: none; }
    .chat-input input:focus { border-color: #4f46e5; }
    .chat-input button { background: #4f46e5; color: white; border: none; border-radius: 24px; padding: 12px 20px; font-size: 14px; cursor: pointer; }
    .chat-input button:hover { background: #4338ca; }
    .new-chat { margin: 0 16px 12px; padding: 8px; background: none; border: 1px solid #ddd; border-radius: 8px; font-size: 13px; color: #888; cursor: pointer; width: calc(100% - 32px); }
    .new-chat:hover { border-color: #4f46e5; color: #4f46e5; }
  </style>
</head>
<body>
<div class="chat-container">
  <div class="chat-header">
    Mental Health Support
    <span>Here to listen and help</span>
  </div>

  <div class="chat-messages" id="messages">
    <div class="message bot">
      Hello! I'm here to support you. How are you feeling today?
    </div>
  </div>

  <button class="new-chat" onclick="newChat()">+ New conversation</button>

  <div class="chat-input">
    <input type="text" id="userInput" placeholder="Type your message..." onkeydown="if(event.key==='Enter') sendMessage()"/>
    <button onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
  let sessionId = null;

  async function sendMessage() {
    const input   = document.getElementById('userInput');
    const text    = input.value.trim();
    if (!text) return;

    appendMessage(text, 'user');
    input.value = '';

    const typing = appendTyping();

    try {
      const res = await fetch('/chat', {
        method : 'POST',
        headers: { 'Content-Type': 'application/json' },
        body   : JSON.stringify({ message: text, session_id: sessionId }),
      });

      const data = await res.json();
      sessionId  = data.session_id;

      typing.remove();
      appendMessage(data.response, 'bot', data.intent, data.emotion);

    } catch (err) {
      typing.remove();
      appendMessage('Something went wrong. Please try again.', 'bot');
    }
  }

  function appendMessage(text, role, intent='', emotion='') {
    const messages = document.getElementById('messages');
    const div      = document.createElement('div');
    div.className  = `message ${role}`;
    div.innerHTML  = text;

    if (role === 'bot' && intent) {
      const meta    = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = `intent: ${intent}  ·  emotion: ${emotion}`;
      div.appendChild(meta);
    }

    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
  }

  function appendTyping() {
    const messages = document.getElementById('messages');
    const div      = document.createElement('div');
    div.className  = 'typing';
    div.textContent = 'typing...';
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
    return div;
  }

  async function newChat() {
    if (sessionId) {
      await fetch(`/session/${sessionId}`, { method: 'DELETE' });
    }
    sessionId = null;
    const messages = document.getElementById('messages');
    messages.innerHTML = '<div class="message bot">Hello! I\'m here to support you. How are you feeling today?</div>';
  }
</script>
</body>
</html>
